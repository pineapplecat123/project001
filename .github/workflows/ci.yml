name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: GUT tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ~/godot-bin
          key: godot-bin-${{ env.GODOT_VERSION }}-stable-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot

      - name: Install Godot
        run: |
          chmod +x ~/godot-bin/godot
          sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot
          godot --version

      - name: Import project
        run: godot --headless --import

      - name: Install fonttools for charset check
        run: pip install --user fonttools

      - name: Pre-push gate (version + UI charset)
        run: bash tools/pre_push_check.sh

      - name: Run GUT tests
        run: godot --headless -s addons/gut/gut_cmdln.gd -gexit
